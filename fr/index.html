          <h1>Learn Core Skills — entraînement gratuit basé sur la maîtrise pour les enfants</h1>
          <p>Par l'équipe learnCoreSkills</p>
          <p>Des activités d'entraînement gratuites et basées sur la maîtrise, en mathématiques et sur l'ensemble des compétences de l'enfant, suivies individuellement, sans vidéos de cours à regarder.</p>
          <h2>Ce que votre enfant peut pratiquer</h2>
          <p>Des activités de mathématiques et de compétences de vie, du préscolaire à la 5e année, avec un suivi de la maîtrise pour chaque enfant. Aucune vidéo de cours à regarder : l'enfant pratique, reçoit un retour immédiat et progresse à son rythme.</p>
          <h2>Comment ça marche</h2>
          <p>L'enfant choisit une compétence et répond à de courtes questions. Chaque réponse est corrigée tout de suite, avec une explication quand elle est fausse. Quand une compétence est bien maîtrisée, la suivante se débloque ; sinon, l'enfant reçoit d'autres exemples. Les parents voient, compétence par compétence, ce qui est solide et ce qui mérite un nouveau regard, sans compte à créer.</p>
          <h2>Pourquoi la maîtrise</h2>
          <p>Beaucoup d'enfants récitent une procédure sans la comprendre. Ici, on pratique une compétence jusqu'à ce qu'elle soit fiable, avec des activités variées, des images concrètes et des tâches du quotidien comme compter de la monnaie, mesurer ou lire l'heure.</p>
          <h2>Pour les parents</h2>
          <p>Choisissez un niveau, ajoutez vos enfants et suivez leur progression depuis l'espace parent. Les données restent sur votre appareil et peuvent être exportées ou importées.</p>
          <h2>À quoi ressemble une séance de pratique</h2>
          <p>Une séance est courte, habituellement de cinq à dix minutes. L'enfant voit une question à la fois, souvent avec des images qu'il peut compter, déplacer ou comparer, et touche ou écrit sa réponse. Une bonne réponse est soulignée et la question suivante est légèrement différente, de sorte que l'enfant ne peut pas simplement répéter un modèle. Une erreur reçoit une explication bienveillante et une occasion d'essayer tout de suite une question semblable. À la fin, l'enfant voit ce qui a bien fonctionné et ce qu'il doit pratiquer ensuite, et l'espace parent l'enregistre.</p>
          <h2>Vie privée et publicité</h2>
          <p>Les données de pratique des enfants ne quittent jamais l'appareil de la famille, et nous ne demandons ni nom, ni courriel, ni mot de passe aux enfants. La publicité, lorsqu'elle apparaît, se limite aux pages écrites pour les adultes, comme les articles, et n'est jamais placée sur les écrans d'activités des enfants. Vous trouverez les détails sur la page Confidentialité, et vous pouvez nous poser vos questions par la page Contact.</p>
          <h2>À qui s'adresse le site</h2>
          <p>Les enfants du préscolaire à la 5e année s'exercent seuls ou auprès d'un parent. Les parents et les enseignants utilisent l'espace parent pour ajouter des enfants, choisir un niveau et voir quelles compétences sont acquises. Le site est offert en français et en anglais, et fonctionne sur téléphone, tablette et ordinateur sans rien installer.</p>
          <h2>Questions fréquentes</h2>
          <h3>Est-ce vraiment gratuit ?</h3>
          <p>Oui. Les activités, le suivi des progrès et l'espace parent sont gratuits. Les pages destinées aux adultes peuvent afficher de la publicité qui aide à financer le site ; les écrans d'activités des enfants n'en affichent jamais.</p>
          <h3>Faut-il un compte ?</h3>
          <p>Non. Les progrès de chaque enfant sont enregistrés sur votre propre appareil, et vous pouvez les exporter ou les importer sur un autre appareil quand vous le voulez.</p>
          <h3>Que veut dire maîtrise ?</h3>
          <p>Une compétence n'est acquise que lorsque l'enfant répond correctement et de façon constante à des questions différentes, et non après un seul coup de chance. D'ici là, la compétence revient avec de nouveaux exemples.</p>
          <h3>Que peut pratiquer mon enfant aujourd'hui ?</h3>
          <p>Les mathématiques sont la première matière, du dénombrement et des décompositions de nombres aux fractions, à l'argent, aux mesures et à la lecture de l'heure. D'autres domaines de compétences de vie, comme la santé, l'argent et apprendre à apprendre, apparaissent dans le programme au fur et à mesure de leur création.</p>
          <h3>Qui écrit les activités et les articles ?</h3>
          <p>L'équipe learnCoreSkills les écrit, les vérifie par rapport au niveau indiqué et corrige les erreurs signalées par les lecteurs grâce à la page Contact.</p>
          <h2>À propos de ce site</h2>
          <p>learnCoreSkills est un projet éducatif indépendant et gratuit. Les activités sont courtes, corrigées immédiatement et suivies pour chaque enfant ; les données de pratique restent sur l'appareil de la famille. Les écrans des enfants n'affichent aucune publicité.</p>
