          <h1>Learn Core Skills — entraînement gratuit basé sur la maîtrise pour les enfants</h1>
          <p>Par l'équipe learnCoreSkills</p>
          <p>Des activités d'entraînement gratuites et basées sur la maîtrise, en mathématiques et sur l'ensemble des compétences de l'enfant, suivies individuellement, sans vidéos de cours à regarder.</p>
          <h2>Ce que votre enfant peut pratiquer</h2>
          <p>Des activités de mathématiques et de compétences de vie, du préscolaire à la 5e année, avec un suivi de la maîtrise pour chaque enfant. Aucune vidéo de cours à regarder : l'enfant pratique, reçoit un retour immédiat et progresse à son rythme.</p>
          <h2>Comment ça marche</h2>
          <p>L'enfant choisit une compétence et répond à de courtes questions. Chaque réponse est corrigée tout de suite, avec une explication quand elle est fausse. Quand une compétence est bien maîtrisée, la suivante se débloque ; sinon, l'enfant reçoit d'autres exemples. Les parents voient, compétence par compétence, ce qui est solide et ce qui mérite un nouveau regard, sans compte à créer.</p>
          <h2>Pourquoi la maîtrise</h2>
          <p>Beaucoup d'enfants récitent une procédure sans la comprendre. Ici, on pratique une compétence jusqu'à ce qu'elle soit fiable, avec des activités variées, des images concrètes et des tâches du quotidien comme compter de la monnaie, mesurer ou lire l'heure.</p>
          <h2>Pour les parents</h2>
          <p>Choisissez un niveau, ajoutez vos enfants et suivez leur progression depuis l'espace parent. Les données restent sur votre appareil et peuvent être exportées ou importées.</p>
          <h2>À propos de ce site</h2>
          <p>learnCoreSkills est un projet éducatif indépendant et gratuit. Les activités sont courtes, corrigées immédiatement et suivies pour chaque enfant ; les données de pratique restent sur l'appareil de la famille. Les écrans des enfants n'affichent aucune publicité.</p>
