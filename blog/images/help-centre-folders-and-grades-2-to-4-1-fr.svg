<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t-1" font-family="Arial, Helvetica, sans-serif">
<title id="t-1">Activités classées d’abord par sujet, puis par année : Sens du nombre avec les étagères de 1re et de 2e année, Valeur de position avec une étagère de 1re année</title>
<rect width="640" height="340" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Sujet, puis année</text>
<rect x="30" y="60" width="200" height="44" rx="8" fill="#e0e7ff" stroke="#1f2937" stroke-width="2"/>
<text x="130" y="89" text-anchor="middle" font-size="18" fill="#111827">Sens du nombre</text>
<rect x="30" y="200" width="200" height="44" rx="8" fill="#e0e7ff" stroke="#1f2937" stroke-width="2"/>
<text x="130" y="229" text-anchor="middle" font-size="18" fill="#111827">Valeur de position</text>
<path d="M230 82 H300 M300 82 V132 M300 82 V82 M300 132 H340 M300 82 H340" fill="none" stroke="#1f2937" stroke-width="2"/>
<rect x="340" y="62" width="110" height="40" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
<text x="395" y="88" text-anchor="middle" font-size="18" fill="#111827">1re année</text>
<rect x="340" y="112" width="110" height="40" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
<text x="395" y="138" text-anchor="middle" font-size="18" fill="#111827">2e année</text>
<path d="M230 222 H340" fill="none" stroke="#1f2937" stroke-width="2"/>
<rect x="340" y="202" width="110" height="40" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
<text x="395" y="228" text-anchor="middle" font-size="18" fill="#111827">1re année</text>
<path d="M450 82 H480" fill="none" stroke="#1f2937" stroke-width="2"/>
<rect x="480" y="62" width="130" height="40" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/>
<text x="545" y="88" text-anchor="middle" font-size="18" fill="#111827">22 activités</text>
<text x="320" y="300" text-anchor="middle" font-size="16" fill="#374151">Chaque étagère contient un dossier par activité</text>
</svg>
