<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t-2" font-family="Arial, Helvetica, sans-serif">
<title id="t-2">Trois colonnes pour les 2e, 3e et 4e années avec 120, 138 et 123 habiletés, chacune avec deux jeux, 381 habiletés au total</title>
<rect width="640" height="300" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Deux jeux pour chaque habileté</text>
<g font-size="18" fill="#111827" text-anchor="middle">
<text x="125" y="78">2e année</text>
<text x="320" y="78">3e année</text>
<text x="515" y="78">4e année</text>
</g>
<g stroke="#1f2937" stroke-width="2">
<rect x="50" y="92" width="70" height="60" rx="10" fill="#dbeafe"/>
<rect x="130" y="92" width="70" height="60" rx="10" fill="#fef3c7"/>
<rect x="245" y="92" width="70" height="60" rx="10" fill="#dbeafe"/>
<rect x="325" y="92" width="70" height="60" rx="10" fill="#fef3c7"/>
<rect x="440" y="92" width="70" height="60" rx="10" fill="#dbeafe"/>
<rect x="520" y="92" width="70" height="60" rx="10" fill="#fef3c7"/>
</g>
<g font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">
<text x="85" y="130">A</text><text x="165" y="130">B</text>
<text x="280" y="130">A</text><text x="360" y="130">B</text>
<text x="475" y="130">A</text><text x="555" y="130">B</text>
</g>
<g font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">
<text x="125" y="200">120</text>
<text x="320" y="200">138</text>
<text x="515" y="200">123</text>
</g>
<text x="320" y="262" text-anchor="middle" font-size="20" fill="#111827">120 + 138 + 123 = 381 habiletés</text>
</svg>
