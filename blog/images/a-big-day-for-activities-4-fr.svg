<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t-4">
<title id="t-4">Rendre la monnaie sur 1 dollar pour un article de 65 cents en comptant vers le haut : une pièce de 5 cents jusqu’à 70, une autre jusqu’à 75, puis une pièce de 25 cents jusqu’à 100</title>
<rect width="640" height="240" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
<line x1="60" y1="170" x2="580" y2="170" stroke="#1d2939" stroke-width="3"/>
<g stroke="#1d2939" stroke-width="3"><line x1="60" y1="158" x2="60" y2="182"/><line x1="200" y1="158" x2="200" y2="182"/><line x1="340" y1="158" x2="340" y2="182"/><line x1="580" y1="158" x2="580" y2="182"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1d2939">
<text x="60" y="212">65</text><text x="200" y="212">70</text><text x="340" y="212">75</text><text x="580" y="212">100</text>
</g>
<g fill="#e5e7eb" stroke="#1d2939" stroke-width="3">
<circle cx="130" cy="95" r="30"/><circle cx="270" cy="95" r="30"/><circle cx="460" cy="95" r="40"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1d2939">
<text x="130" y="104">5¢</text><text x="270" y="104">5¢</text><text x="460" y="104">25¢</text>
<text x="320" y="36" font-size="22" font-weight="normal">prix 65¢, payé 100¢ : on compte vers le haut</text>
</g>
</svg>
