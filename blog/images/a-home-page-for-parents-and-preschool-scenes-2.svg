<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="t-2">
<title id="t-2">Three rows of four numbered dots. The first row is counted 1, 2, 3, 4 correctly. The second skips the third dot. The third counts one dot twice, 1, 2, 2, 3.</title>
<rect width="420" height="260" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a2a44" text-anchor="middle">
<circle cx="100" cy="60" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="170" cy="60" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="240" cy="60" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="310" cy="60" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<text x="100" y="67">1</text><text x="170" y="67">2</text><text x="240" y="67">3</text><text x="310" y="67">4</text>
<text x="360" y="67" font-size="26">&#10003;</text>
<circle cx="100" cy="130" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="170" cy="130" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="240" cy="130" r="22" fill="#eeeeee" stroke="#1a2a44" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="310" cy="130" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<text x="100" y="137">1</text><text x="170" y="137">2</text><text x="240" y="137">-</text><text x="310" y="137">4</text>
<text x="360" y="137" font-size="26">&#10007;</text>
<circle cx="100" cy="200" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="170" cy="200" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<circle cx="240" cy="200" r="22" fill="#ffd9d0" stroke="#1a2a44" stroke-width="2"/>
<circle cx="310" cy="200" r="22" fill="#cfeedd" stroke="#1a2a44" stroke-width="2"/>
<text x="100" y="207">1</text><text x="170" y="207">2</text><text x="240" y="207">2</text><text x="310" y="207">3</text>
<text x="360" y="207" font-size="26">&#10007;</text>
</g>
</svg>
