<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t-1">
<title id="t-1">A ten-frame with seven dots, five in the top row and two in the bottom row, next to a number bond showing 10 made of 6 and 4</title>
<rect width="640" height="260" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
<g fill="#ffffff" stroke="#1d2939" stroke-width="2">
<rect x="30" y="60" width="52" height="52"/><rect x="82" y="60" width="52" height="52"/><rect x="134" y="60" width="52" height="52"/><rect x="186" y="60" width="52" height="52"/><rect x="238" y="60" width="52" height="52"/>
<rect x="30" y="112" width="52" height="52"/><rect x="82" y="112" width="52" height="52"/><rect x="134" y="112" width="52" height="52"/><rect x="186" y="112" width="52" height="52"/><rect x="238" y="112" width="52" height="52"/>
</g>
<g fill="#1d4ed8">
<circle cx="56" cy="86" r="18"/><circle cx="108" cy="86" r="18"/><circle cx="160" cy="86" r="18"/><circle cx="212" cy="86" r="18"/><circle cx="264" cy="86" r="18"/>
</g>
<g fill="#c2410c">
<circle cx="56" cy="138" r="18"/><circle cx="108" cy="138" r="18"/>
</g>
<text x="160" y="210" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1d2939">7 = 5 + 2</text>
<g stroke="#1d2939" stroke-width="2"><line x1="480" y1="92" x2="425" y2="150"/><line x1="480" y1="92" x2="535" y2="150"/></g>
<g fill="#ffffff" stroke="#1d2939" stroke-width="3">
<circle cx="480" cy="62" r="32"/><circle cx="415" cy="178" r="32"/><circle cx="545" cy="178" r="32"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1d2939">
<text x="480" y="72">10</text><text x="415" y="188">6</text><text x="545" y="188">4</text>
</g>
<text x="480" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#1d2939">6 + 4 = 10</text>
</svg>
