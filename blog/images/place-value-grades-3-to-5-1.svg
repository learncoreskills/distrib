<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t-1">
<title id="t-1">A place-value chart for 3,462 with columns for thousands, hundreds, tens and ones, and the digit 3 worth 3,000</title>
<rect width="640" height="260" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1a1a2e" text-anchor="middle">
<g stroke="#1a1a2e" stroke-width="2">
<rect x="40" y="30" width="140" height="60" fill="#fde68a"/>
<rect x="180" y="30" width="140" height="60" fill="#bfdbfe"/>
<rect x="320" y="30" width="140" height="60" fill="#bbf7d0"/>
<rect x="460" y="30" width="140" height="60" fill="#fecaca"/>
<rect x="40" y="90" width="140" height="80" fill="#fff"/>
<rect x="180" y="90" width="140" height="80" fill="#fff"/>
<rect x="320" y="90" width="140" height="80" fill="#fff"/>
<rect x="460" y="90" width="140" height="80" fill="#fff"/>
</g>
<text x="110" y="68" font-size="22" font-weight="bold">1000s</text>
<text x="250" y="68" font-size="22" font-weight="bold">100s</text>
<text x="390" y="68" font-size="22" font-weight="bold">10s</text>
<text x="530" y="68" font-size="22" font-weight="bold">1s</text>
<text x="110" y="150" font-size="52" font-weight="bold">3</text>
<text x="250" y="150" font-size="52" font-weight="bold">4</text>
<text x="390" y="150" font-size="52" font-weight="bold">6</text>
<text x="530" y="150" font-size="52" font-weight="bold">2</text>
<text x="110" y="205" font-size="22">= 3,000</text>
<text x="250" y="205" font-size="22">= 400</text>
<text x="390" y="205" font-size="22">= 60</text>
<text x="530" y="205" font-size="22">= 2</text>
<text x="320" y="245" font-size="20">3,000 + 400 + 60 + 2 = 3,462</text>
</g>
</svg>
