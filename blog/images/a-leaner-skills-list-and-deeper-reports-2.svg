<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="t-2">
<title id="t-2">A progress report opening from subject to topics to skills to activities, with a percentage on each row</title>
<rect width="560" height="280" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<g font-family="sans-serif" font-size="18" fill="#111827">
<text x="30" y="46" font-weight="bold">Mathematics</text><text x="500" y="46" font-weight="bold" text-anchor="end">62%</text>
<text x="50" y="82">▾ Numbers</text><text x="500" y="82" text-anchor="end">71%</text>
<text x="70" y="118">▾ Count a set</text><text x="500" y="118" text-anchor="end">80%</text>
<text x="90" y="154">Dot counting</text><text x="500" y="154" text-anchor="end">90%</text>
<text x="90" y="190">Number line</text><text x="500" y="190" text-anchor="end">not played yet</text>
<text x="50" y="226">▸ Fractions</text><text x="500" y="226" text-anchor="end">40%</text>
</g>
<g stroke="#9ca3af" stroke-width="1">
<path d="M30 58 H530"/><path d="M30 94 H530"/><path d="M30 130 H530"/><path d="M30 166 H530"/><path d="M30 202 H530"/>
</g>
<g font-family="sans-serif" font-size="16" fill="#374151">
<text x="30" y="262">Subject, topic, skill, activity</text>
</g>
</svg>
