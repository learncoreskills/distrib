<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t-2">
<title id="t-2">Deux bandes de même longueur : 3/8 colorié en huitièmes et 2/5 colorié en cinquièmes, tous deux réécrits en quarantièmes, 15/40 et 16/40</title>
<rect width="640" height="260" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1d2939">
<text x="30" y="62">3/8</text><text x="30" y="152">2/5</text>
</g>
<rect x="100" y="36" width="280" height="40" fill="#bfdbfe"/>
<rect x="100" y="36" width="105" height="40" fill="#1d4ed8"/>
<rect x="100" y="126" width="280" height="40" fill="#fed7aa"/>
<rect x="100" y="126" width="112" height="40" fill="#c2410c"/>
<g stroke="#ffffff" stroke-width="2">
<line x1="135" y1="36" x2="135" y2="76"/><line x1="170" y1="36" x2="170" y2="76"/><line x1="205" y1="36" x2="205" y2="76"/><line x1="240" y1="36" x2="240" y2="76"/><line x1="275" y1="36" x2="275" y2="76"/><line x1="310" y1="36" x2="310" y2="76"/><line x1="345" y1="36" x2="345" y2="76"/>
<line x1="156" y1="126" x2="156" y2="166"/><line x1="212" y1="126" x2="212" y2="166"/><line x1="268" y1="126" x2="268" y2="166"/><line x1="324" y1="126" x2="324" y2="166"/>
</g>
<g fill="none" stroke="#1d2939" stroke-width="2"><rect x="100" y="36" width="280" height="40"/><rect x="100" y="126" width="280" height="40"/></g>
<line x1="205" y1="20" x2="205" y2="190" stroke="#1d2939" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="212" y1="20" x2="212" y2="190" stroke="#1d2939" stroke-width="2" stroke-dasharray="6 5"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1d2939">
<text x="410" y="62">= 15/40</text><text x="410" y="152">= 16/40</text>
<text x="320" y="228" text-anchor="middle">15 &lt; 16, donc 3/8 &lt; 2/5</text>
</g>
</svg>
